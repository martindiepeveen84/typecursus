<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterloper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one column arcade cabinet — HUD strip, 16:9 screen, keyboard panel underneath. Single committed dark arcade look. */
:root{
  --bg:#141833; --panel:#1f2448; --panel2:#2a3060; --line:#3b4380;
  --fg:#fff6e3; --muted:#a9b0dc; --accent:#ffcc3d; --accent2:#4fd1ff;
  --good:#5be37d; --bad:#ff5f6d;
  --f-pink:#ff7eb6; --f-ring:#ffa94d; --f-mid:#ffe066; --f-index:#69db7c; --f-thumb:#b197fc;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;
  -webkit-user-select:none;user-select:none}
#app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px;transform-origin:top center}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-family:var(--display)}
.hud .logo{font-weight:700;font-size:1.35rem;color:var(--accent);letter-spacing:.5px;text-shadow:2px 2px 0 #7a4b00}
.hud .logo small{display:block;font-size:.65rem;color:var(--muted);font-weight:400;letter-spacing:1px;text-transform:uppercase;text-shadow:none}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:58px}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hud .spacer{flex:1}
.tempo{width:110px;height:12px;background:#0d1028;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.tempo i{display:block;height:100%;background:linear-gradient(90deg,#4fd1ff,#ffcc3d,#ff5f6d);width:20%;transition:width .4s}
button{font-family:var(--display);font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:10px 20px;cursor:pointer;background:var(--accent);color:#2b1d00;box-shadow:0 4px 0 #a67700;transition:transform .08s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:0 2px 0 #a67700}
button.ghost{background:var(--panel2);color:var(--fg);box-shadow:0 4px 0 #11143a}
button.ghost:active{box-shadow:0 2px 0 #11143a}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.icon{padding:8px 12px;font-size:1rem;min-width:44px}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;border:3px solid var(--line);background:#000;box-shadow:0 10px 40px #0008}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#promptbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0d1028ee;border:2px solid var(--line);border-radius:14px;padding:8px 18px 6px;text-align:center;min-width:180px;max-width:92%;pointer-events:none;transition:border-color .15s}
#promptbar.err{border-color:var(--bad);animation:shake .25s}
#promptbar .txt{font-family:var(--display);font-size:clamp(1.4rem,4vw,2.4rem);letter-spacing:.08em;white-space:pre;font-weight:600;line-height:1.1}
#promptbar .done{color:var(--good)}
#promptbar .cur{color:#1a1200;background:var(--accent);border-radius:6px;padding:0 .12em;box-shadow:0 0 14px var(--accent)}
#promptbar .rest{color:var(--fg);opacity:.85}
#promptbar .sp{display:inline-block;width:.6em;border-bottom:3px solid currentColor;height:.9em;vertical-align:baseline;margin:0 .05em}
#promptbar .cur.sp{background:var(--accent);border-bottom-color:#1a1200}
#promptbar .hint{font-size:.78rem;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:center}
#promptbar .hint i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
/* Meldingen linksonder (weg van de opdracht en van de rechterkant waar alles binnenkomt); tips direct onder de opdracht. */
#toasts{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;align-items:flex-start;max-width:38%}
.toast{background:#0d1028dd;border:2px solid var(--accent);color:var(--fg);border-radius:10px;padding:4px 10px;font-family:var(--display);font-weight:600;font-size:.85rem;animation:toastin .3s ease-out;text-align:left}
.toast.badge{border-color:var(--accent2)}
#tipbar{position:absolute;left:50%;top:92px;transform:translateX(-50%);max-width:70%;pointer-events:none;display:flex;justify-content:center}
.toast.tip{border-color:var(--f-pink);font-family:var(--body);font-weight:700;font-size:.9rem;text-align:center;animation:tipin .25s ease-out}
.toast.tip::before{content:"Tip: ";color:var(--f-pink)}
@keyframes toastin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes tipin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e24cc;backdrop-filter:blur(3px);padding:16px}
#overlay[hidden]{display:none!important}
.card{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:22px 26px;max-width:580px;width:100%;text-align:center;max-height:100%;overflow:auto}
.card h1{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 4px;color:var(--accent);text-shadow:3px 3px 0 #7a4b00;text-wrap:balance}
.card h2{font-family:var(--display);font-size:1.5rem;margin:0 0 8px;text-wrap:balance}
.card p{margin:6px 0;color:var(--muted);line-height:1.45}
.card p.lead{color:var(--fg);font-size:1.05rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.profiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.profiles button{display:flex;align-items:center;gap:10px;background:var(--panel2);color:var(--fg);box-shadow:0 4px 0 #11143a}
.profiles button .dot{width:18px;height:18px;border-radius:5px;display:inline-block}
.profiles button small{display:block;font-weight:400;font-size:.7rem;color:var(--muted);text-align:left}
.newprof{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:8px}
.newprof input{font-family:var(--display);font-size:1.05rem;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#0d1028;color:var(--fg);width:170px}
.newprof input:focus{outline:2px solid var(--accent2)}
.swatches{display:flex;gap:6px}
.sw{width:28px;height:28px;border-radius:8px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.game{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--fg);box-shadow:0 4px 0 #11143a;font-family:var(--body);font-weight:400;font-size:.9rem}
.game:hover{border-color:var(--accent)}
.game b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--accent);margin-bottom:4px}
.game .pv{height:46px;border-radius:8px;margin-bottom:8px;background:linear-gradient(#5ec8ff 60%,#4cc24a 60% 70%,#8b5a2b 70%)}
.game .pv.house{background:linear-gradient(#ffd9e6 0 55%,#c98b5a 55% 62%,#f7c9a6 62%)}
.game .pv.space{background:radial-gradient(circle at 70% 40%,#6a2a7a55,transparent 50%),radial-gradient(circle at 20% 70%,#2a3a8a66,transparent 45%),linear-gradient(#05070f,#0d1430)}
.games{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card.games-card{max-width:680px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.stats div{background:#0d1028;border-radius:10px;padding:8px}
.stats b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.stats span{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.bigkeys{display:flex;gap:12px;justify-content:center;margin:12px 0}
.bigkey{width:64px;height:64px;border-radius:12px;background:#fff;color:#111;font-family:var(--display);font-weight:700;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #999;border-bottom:4px solid var(--kc,#ccc)}
.practice{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0}
.practice .big{width:120px;height:120px;border-radius:22px;background:#fff;color:#111;font-family:var(--display);font-weight:700;font-size:4.2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 #999;border-bottom:8px solid var(--kc,#ccc);transition:transform .1s}
.practice .big.ok{transform:scale(1.12);background:var(--good)}
.practice .big.bad{animation:shake2 .25s;background:var(--bad);color:#fff}
.practice .big.sp{font-size:1.4rem}
@keyframes shake2{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.practice .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.practice .dots i{width:14px;height:14px;border-radius:50%;background:#0d1028;border:2px solid var(--line)}
.practice .dots i.on{background:var(--good);border-color:var(--good)}
.practice .dots i.cur{border-color:var(--accent);box-shadow:0 0 8px var(--accent)}
.practice .fing{font-family:var(--display);font-size:1.1rem;display:flex;gap:8px;align-items:center}
.practice .fing i{width:14px;height:14px;border-radius:50%;display:inline-block}
.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.levels button{background:var(--panel2);color:var(--fg);box-shadow:0 4px 0 #11143a;font-size:.9rem;padding:8px 14px}
.levels button.on{background:var(--accent);color:#2b1d00;box-shadow:0 4px 0 #a67700}
.card.wide{max-width:720px}
.heat{display:flex;flex-direction:column;gap:5px;align-items:center;margin:12px 0}
.heat .hrow{display:flex;gap:5px}
.heat .hk{width:clamp(30px,5.6vw,52px);height:clamp(34px,5.6vw,52px);border-radius:7px;background:var(--hc,#2a3060);color:#111;font-family:var(--display);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:1rem;border:2px solid #0d1028}
.heat .hk small{font-size:.58rem;font-weight:600;opacity:.8}
.heat .hk.na{background:#2a3060;color:var(--muted)}
.heat .hk.space{width:clamp(150px,30vw,300px)}
.heatlegend{display:flex;gap:4px;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted)}
.heatlegend i{width:60px;height:10px;border-radius:5px;background:linear-gradient(90deg,#ff5f6d,#ffcc3d,#5be37d)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:10px}
.lists div{background:#0d1028;border-radius:10px;padding:10px 12px;font-size:.85rem}
.lists h3{margin:0 0 6px;font-family:var(--display);font-size:1rem}
.lists ul{margin:0;padding-left:18px;color:var(--muted)}
.lists b{color:var(--fg);font-family:var(--display)}
@media (max-width:520px){.lists{grid-template-columns:1fr}}
.vols{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-size:.85rem;color:var(--muted)}
.vols input{vertical-align:middle;accent-color:var(--accent);width:120px}
.badgelist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.badgelist span{background:#0d1028;border:1px solid var(--accent2);border-radius:999px;padding:3px 10px;font-size:.8rem}

.bottom{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.unlock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem}
.unlock b{font-family:var(--display);color:var(--accent)}
.bar{flex:1;min-width:120px;height:14px;background:#0d1028;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--good));width:0;transition:width .3s}
#kb{display:flex;flex-direction:column;gap:5px;align-items:center;position:relative;padding-bottom:clamp(70px,10vw,120px)}
#hands{position:absolute;inset:0;pointer-events:none;overflow:visible}
#hands.off{display:none}
#hands{opacity:.9}
#hands .palm{fill:#f1c9ad;stroke:#b9825f;stroke-width:2.5;stroke-linejoin:round}
#hands .shade{fill:#e2ad8c;opacity:.45}
#hands .fo{fill:none;stroke:#b9825f;stroke-linecap:round}
#hands .ff{fill:none;stroke:#f1c9ad;stroke-linecap:round}
#hands .fb{fill:none;stroke:#f1c9ad;stroke-linecap:round}
#hands .tip{stroke:#fff;stroke-width:2}
.krow{display:flex;gap:5px;justify-content:center}
.key{width:clamp(26px,4.4vw,46px);height:clamp(28px,4.4vw,44px);border-radius:7px;background:#e9ecff;color:#1b1f3a;font-family:var(--display);font-weight:600;font-size:clamp(.7rem,1.6vw,1rem);display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--kc,#aab);box-shadow:0 2px 0 #0004;transition:transform .08s,background .1s;position:relative}
.key.wide{width:clamp(52px,9vw,92px);font-size:.7rem}
.key.space{width:clamp(140px,30vw,300px)}
.key.locked{opacity:.28}
.key.next{background:var(--accent);transform:translateY(-3px) scale(1.08);box-shadow:0 0 16px var(--accent),0 4px 0 #0004;z-index:1}
.key.pressed{transform:translateY(2px);border-bottom-width:1px}
.key.wrong{background:var(--bad);color:#fff}
.key.bump{position:absolute;top:2px;right:4px;width:5px;height:5px;border-radius:50%;background:#1b1f3a55}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:.72rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.foot{font-size:.75rem;color:var(--muted);text-align:center}
.foot kbd{background:#0d1028;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--display)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.hud{gap:8px}.stat{min-width:46px}.stat b{font-size:1rem}.tempo{width:70px}}
</style>

<div id="app">
  <header class="hud">
    <div class="logo" id="logo">Letterloper<small>Typ-avontuur</small></div>
    <div class="stat"><b id="score">0</b><span>Punten</span></div>
    <div class="stat"><b id="coins">0</b><span>Munten</span></div>
    <div class="stat"><b id="combo">0</b><span>Combo</span></div>
    <div class="stat"><b id="acc">100%</b><span>Goed</span></div>
    <div class="stat"><b id="world">1</b><span id="worldLbl">Wereld</span></div>
    <div class="stat"><div class="tempo"><i id="tempo"></i></div><span>Tempo</span></div>
    <div class="spacer"></div>
    <button class="ghost icon" id="btnCalm" title="Met of zonder tijd">⏱ met tijd</button>
    <button class="ghost icon" id="btnMute" title="Geluid aan/uit">♪</button>
    <button class="ghost icon" id="btnPause" title="Pauze (Esc)">❚❚</button>
    <button class="ghost icon" id="btnStop" title="Stoppen, naar het hoofdmenu">■ stop</button>
  </header>

  <div class="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="promptbar" hidden><div class="txt"></div><div class="hint"></div></div>
    <div id="toasts"></div>
    <div id="tipbar"></div>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>

  <div class="bottom">
    <div class="unlock"><span>Volgende toetsen:</span><b id="nextKeys">d en k</b><div class="bar"><i id="mastery"></i></div><span id="stageTxt"></span><span id="goal" style="color:var(--muted)"></span></div>
    <div id="kb"></div>
    <div class="legend">
      <button class="ghost icon" id="btnHands" style="padding:4px 10px;font-size:.75rem">✋ handen aan</button>
      <span style="--c:var(--f-pink)">pink</span><span style="--c:var(--f-ring)">ringvinger</span><span style="--c:var(--f-mid)">middelvinger</span><span style="--c:var(--f-index)">wijsvinger</span><span style="--c:var(--f-thumb)">duim</span>
    </div>
    <div class="foot"><kbd>Esc</kbd> pauze · ⏱ zet de tijd aan of uit · Goed getypt = sneller · Elke fout = het spel wordt even iets rustiger. Je kunt niet af.</div>
  </div>
</div>

// Verhaaltjes voor gevorderden: zin voor zin, in volgorde.
const STORIES=[

function sprite(map,x,y,s,pal){ for(let r=0;r<map.length;r++) for(let c=0;c<map[r].length;c++){ const ch=map[r][c]; if(ch==='.') continue; cx.fillStyle=pal[ch]||'#000'; cx.fillRect(Math.round(x+c*s),Math.round(y+r*s),s,s); } }

// ───────────────────────── Opdrachten maken (adaptief, zone van naaste ontwikkeling) ─────────────────────────
function allowed(){ const s=new Set(); for(let i=0;i<prof.stage;i++) for(const c of GROUPS[i].keys) s.add(c); return s; }
const capsOn=()=>GROUPS.slice(0,prof.stage).some(g=>g.caps);
const newKeys=()=>prof.focus>0?GROUPS[prof.stage-1].keys:'';
// Kans dat een toets in één keer goed gaat (c/p), met prior zodat weinig data niet overreageert.
function firstTry(k){ const st=prof.keys[k]; if(!st||!st.p) return null; return st.c/st.p; }
function kw(c){ c=keyOf(c); const st=prof.keys[c]||{n:0,e:0,p:0,c:0}; const er=st.e/Math.max(st.n,4); const ft=st.p?1-(st.c+2)/(st.p+2):0; return 1+5*er+4*ft+(newKeys().includes(c)?3:0); }
// Zwakke toetsen: genoeg data en vaak niet in één keer goed → extra oefenen voor het spiergeheugen.
function weakKeys(){ const A=allowed(); return [...A].filter(k=>/[a-z ]/.test(k)).map(k=>({k,st:prof.keys[k]})).filter(o=>o.st&&o.st.p>=4&&o.st.c/o.st.p<0.8).sort((a,b)=>a.st.c/a.st.p-b.st.c/b.st.p).map(o=>o.k); }
function pickW(items,wf){ let tot=0; const ws=items.map(i=>{const w=wf(i);tot+=w;return w;}); let r=Math.random()*tot; for(let i=0;i<items.length;i++){ r-=ws[i]; if(r<=0) return items[i]; } return items[items.length-1]; }
function sampleN(arr,n){ const a=arr.slice(); for(let i=a.length-1;i>0&&i>=a.length-n;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(-n); }
const fragScore=w=>[...w].reduce((s,c)=>s+kw(c),0)/w.length;
function makePrompt(){
  const A=allowed(), sp=prof.speed, letters=[...A].filter(c=>/[a-z]/.test(c)), punct=[...A].filter(c=>',.;?'.includes(c));
  const pool=WORDS.filter(w=>[...w].every(c=>A.has(c)));
  // Verhaaltjes-modus: zinnen in volgorde zodra hoofdletters, spatie en punt beschikbaar zijn.
  if(prof.story&&capsOn()&&A.has(' ')&&A.has('.')&&G.prompts%4!==2){
    G.storyNo=G.storyNo||0; const st=STORIES[G.storyNo%STORIES.length]; const s=st[G.storyIdx%st.length]; G.storyIdx++; if(G.storyIdx%st.length===0){ G.storyNo++; }
    if([...s].every(c=>A.has(c.toLowerCase())||c==="'"&&prof.apos)) return s;
  }
  if(prof.apos&&A.has(' ')&&prof.stage>=12&&Math.random()<0.08) return APOS[Math.floor(Math.random()*APOS.length)];
  // Spiergeheugen-beurt: elke vierde opdracht bevat de zwakste toets (los, in een echte lettercombinatie of in een woord).
  const shortW=pool.filter(w=>w.length<=3);
  const twoWords=()=>{ const a=shortW[Math.floor(Math.random()*shortW.length)]; let b=shortW[Math.floor(Math.random()*shortW.length)]; if(b===a&&shortW.length>1) b=shortW[(shortW.indexOf(a)+1)%shortW.length]; return a+' '+b; };
  // Spatie net vrijgespeeld: oefenen met twee korte woorden, zodat de duim het leert.
  if(A.has(' ')&&newKeys()===' '&&shortW.length>=2&&Math.random()<0.75){ G.drill=false; return twoWords(); }
  const weak=weakKeys();
  if(weak.length&&prof.focus<=8&&G.prompts%4===2){
    const c=weak[Math.floor(Math.random()*Math.min(2,weak.length))];
    if(c===' '){ G.drill=true; return shortW.length>=2?twoWords():'de kat'; } const maxW=prof.stage<=3?1:prof.stage<=5?2:prof.stage<=8?3:4;
    const ws=prof.stage>=7?pool.filter(w=>w.includes(c)&&w.length<=Math.max(3,Math.round(2+sp*2.2))):[];
    const fr=FRAGS.filter(f=>f.includes(c)&&f.length<=maxW&&[...f].every(x=>A.has(x)));
    const src=(ws.length&&Math.random()<0.5)?ws:fr; G.drill=true;
    return src.length?src[Math.floor(Math.random()*src.length)]:c;
  }
  const pWord=(pool.length>=12&&prof.stage>=7&&prof.focus<=8)?Math.min(0.85,0.25+0.04*prof.stage):0;
  if(Math.random()<pWord){
    const maxLen=clamp(Math.round(2+sp*2.2),3,prof.stage<9?4:prof.stage<12?6:12);
    const cands=pool.filter(w=>w.length<=maxLen); const src=cands.length?cands:pool;
    const pick=()=>pickW(sampleN(src,14),fragScore);
    let text=pick();
    if(A.has(' ')&&Math.random()<(sp>0.9?0.4:0.25)){ const w2=sp>0.9?pick():shortW[Math.floor(Math.random()*shortW.length)]; if(w2&&w2!==text) text+=' '+w2; }
    if(capsOn()&&A.has('.')&&A.has(' ')&&sp>1.1&&Math.random()<0.3){
      const sents=SENTENCES.filter(s=>[...s].every(c=>A.has(c.toLowerCase()))); if(sents.length) return sents[Math.floor(Math.random()*sents.length)];
    }
    if(capsOn()&&Math.random()<0.45) text=text[0].toUpperCase()+text.slice(1);
    if(punct.length&&Math.random()<0.35) text+=punct[Math.floor(Math.random()*punct.length)];
    return text;
  }
  // Letterstukjes: alleen combinaties die echt in het Nederlands voorkomen; anders losse letters.
  // Opbouw per stap: eerst losse letters, dan tweetjes, pas later drietjes. Vlak na een nieuwe toets: die toets los of met één bekende.
  const maxN=prof.stage<=3?1:prof.stage<=5?2:prof.stage<=8?3:4;
  const n=clamp(Math.floor(0.6+sp),1,maxN);
  if(prof.focus>8){ const nk=newKeys().replace(' ',''); if(nk){ const c=nk[Math.floor(Math.random()*nk.length)]; if(maxN>=2&&Math.random()<(n>=2?0.5:0.3)){ const fr=FRAGS.filter(f=>f.length===2&&f.includes(c)&&[...f].every(x=>A.has(x))); if(fr.length) return fr[Math.floor(Math.random()*fr.length)]; } return c; } }
  if(n>=2){ const fr=FRAGS.filter(f=>f.length<=n&&[...f].every(c=>A.has(c))); const nf=newKeys(); const focus=nf?fr.filter(f=>[...nf].some(c=>f.includes(c))):[]; const src=(focus.length&&Math.random()<0.6)?focus:fr; if(src.length) return pickW(sampleN(src,14),fragScore); }
  return pickW(letters,kw);
}
// Tijd per opdracht: ruimer vlak na een nieuwe toets (focus), zodat het tempo pas oploopt als de toets zit.
const budget=len=>(2.4+1.0*len)/prof.speed*(prof.focus>0?1.5:1);

function spawnNext(){

  if(G.mode==='house'){
    const toy=TOYS[Math.floor(Math.random()*TOYS.length)]; const slots=[200,480,760]; const x=slots[(G.prompts+Math.floor(Math.random()*2))%3];

    G.obs.push(ob); G.active=ob; renderPrompt(); return;
  }
  const last=G.obs[G.obs.length-1];
  // Nieuwe elementen verschijnen ín beeld (rechts), met een pop-in, zodat je ziet wat je typt.
  const SX=W-130; let x=Math.max(SX,(last?last.x+last.w+170:0));
  if(G.mode==='space'){
    if(G.worldPrompts>=16){ G.worldPrompts=0; G.world++; prof.worlds=Math.max(prof.worlds,G.world); G.coins+=20; prof.coins+=20; SFX.warp(); G.warp=1.4; toast('Sector '+G.world+': '+sector().name); if(G.sectorHits===0){ addScore(100); toast('Schild intact: +100','badge'); } G.sectorHits=0; renderHUD(); }
    // Baas aan het eind van de sector: een lange opdracht (zin of drie woorden), langzaam, dik gepantserd.
    const boss=G.worldPrompts===15; let btext=text;
    if(boss){ const A=allowed(); const sents=SENTENCES.filter(s=>[...s].every(c=>A.has(c.toLowerCase()))); const pool=WORDS.filter(w=>[...w].every(c=>A.has(c))&&w.length>=3); btext=sents.length&&capsOn()?sents[Math.floor(Math.random()*sents.length)]:A.has(' ')&&pool.length>=3?sampleN(pool,3).join(' '):text+text; toast('Baas in aantocht!','tip'); }
    const r=Math.random(); const type=boss?'boss':r<0.45?'asteroid':r<0.8?'drone':r<0.95?'cruiser':'comet';
    const sx=boss?W-200:W-150;
    const ob={type,x:sx,y:boss?H/2-40:rnd(120,GY-60),w:type==='cruiser'?110:boss?180:56,text:btext,pos:0,errors:0,solved:false,resolved:false,spawnX:sx,T:budget(btext.length)*(boss?1.6:1),timer:0,rot:rnd(0,6),hp:0,appear:0};
    G.obs.push(ob); G.active=ob; G.vTarget=clamp((ob.x-HX-40)/ob.T,40,460); burst(ob.x+ob.w/2,ob.y,'#8ff0ff',10); SFX.lock(); renderPrompt(); return;
  }
  if(G.worldPrompts>=15){ G.worldPrompts=0; G.obs.push({type:'flag',x,w:20}); x+=200; }
  const r=Math.random(); const pStar=prof.calm?0.15:0.06; const type=r<0.34?'pit':r<0.66?'enemy':r<1-pStar?'block':'star';
  const ob={type,x,w:type==='pit'?90:48,text,pos:0,errors:0,solved:false,resolved:false,spawnX:x,T:budget(text.length),timer:0,appear:0};
  G.obs.push(ob); G.active=ob; G.vTarget=clamp((x-HX-30)/ob.T,50,460); if(x<W) burst(x+ob.w/2,type==='pit'?GY:GY-60,'#ffffffaa',8);
  renderPrompt();
}

  else if(ob.type==='enemy'){ heroJump(0.45,55); ob.squash=0.5; SFX.stomp(); burst(ob.x+24,GY-20,'#c77dff',12); pop(ob.x+24,GY-70,'Plof!','#fff'); addScore(30); }

  else if(ob.type==='star'){ heroJump(0.5,70); ob.gone=true; SFX.star(); G.coins+=10; prof.coins+=10; burst(ob.x+24,GY-120,'#fff176',24); pop(ob.x+24,GY-160,'+10 munten!','#fff176'); }
}

// Adaptief: snelheid stijgt bij foutloos én vlot, zakt bij fouten (elke fout remt direct al een beetje).
function adapt(ob,how){
  const len=ob.text.length;
  if(how==='miss'){ prof.speed-=0.12; prof.mastery-=0.05; G.perfectRun=0; }
  else if(ob.errors===0){ const margin=prof.calm?1:ob.spawnX?(ob.x-HX)/(ob.spawnX-HX):1-ob.timer/ob.T; prof.speed+=margin>0.35?0.04:0.02; prof.mastery+=0.07*(1+0.08*len); G.perfectRun++; }
  else if(ob.errors===1){ prof.mastery+=0.02; G.perfectRun=0; }
  else { prof.speed-=0.04; prof.mastery-=0.03; G.perfectRun=0; }
  prof.speed=clamp(prof.speed,0.35,5); prof.mastery=clamp(prof.mastery,0,1);
  if(prof.focus>0) prof.focus--;
  setBpm();
  if(prof.mastery>=1&&prof.stage<GROUPS.length){ prof.mastery=0; prof.stage++; prof.focus=14; prof.speed=Math.max(0.35,prof.speed-0.3); setBpm(); showUnlock(); }
  renderMastery();
}
function onError(ob,typed){
  const want=ob.text[ob.pos];
  prof.speed=clamp(prof.speed-0.035,0.35,5); G.errTotal++;
  if(G.mode==='house'){ ob.T+=0.6; ob.mood=0.5; }
  else { G.vTarget*=0.82; ob.T+=0.4; }
  if(ob.errors===1||ob.errors%3===0) tip(tipFor(want,typed));
  else if(G.errTotal%6===0) tip(GENERAL_TIPS[Math.floor(Math.random()*GENERAL_TIPS.length)]);
  setBpm(); renderHUD();
}

function onKey(e){
  if(e.key==='Escape'){ if(G.state==='play') pause(); else if(G.state==='pause') resume(); return; }
  if(G.state==='practice'){ if(e.ctrlKey||e.metaKey||e.altKey) return; if(e.key===' '||e.key==='Enter') e.preventDefault(); practiceKey(e.key); return; }
  if(G.state==='unlock'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); showPractice(GROUPS[prof.stage-1]); return; }
  if(G.state==='over'&&e.key==='Enter'){ e.preventDefault(); startGame(); return; }
  if(G.state!=='play'||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key.length!==1) return;
  e.preventDefault();
  const ob=G.active; if(!ob) return;
  if(e.key==='Dead'||e.key==='Shift') return;   // dode toetsen (´ ¨ ~ op US-international) en Shift zelf tellen niet mee
  const want=ob.text[ob.pos], k=keyOf(want), st=prof.keys[k]||(prof.keys[k]={n:0,e:0,p:0,c:0});
  if(st.p===undefined){ st.p=0; st.c=0; }
  st.n++; prof.totalChars++; G.sessChars++; ob.errAt=ob.errAt||{}; todayAdd(1);
  const tnow=performance.now(), lat=G.lastKeyT?Math.min(5000,tnow-G.lastKeyT):null; G.lastKeyT=tnow;
  if(e.key===want){
    st.p++; if(!ob.errAt[ob.pos]) st.c++;   // in één keer goed?
    if(lat!==null){ st.ms=(st.ms||0)+lat; st.mn=(st.mn||0)+1; G.sessMs+=lat; G.sessOk++; }
    ob.pos++; G.combo++; G.bestCombo=Math.max(G.bestCombo,G.combo); addScore(10*(1+Math.floor(G.combo/10)));
    if(G.mode==='space'){ SFX.laser(); G.bolts.push({x1:HX+64,y1:G.shipY,x2:ob.x+ob.w/2,y2:ob.y,t:0.12}); ob.hp=ob.pos/ob.text.length; burst(ob.x+ob.w/2,ob.y,'#ffb347',3); } else SFX.tick(ob.pos/ob.text.length);
    pressKey(k,false);
    if(ob.pos>=ob.text.length){ ob.solved=true; const perfect=ob.errors===0; addScore(perfect?100:50); G.coins++; prof.coins++; if(ob.text.length>=2&&/[a-z]{2,}/i.test(ob.text)) prof.wordDone=true;
      if(G.mode==='house'){ SFX.solved(); wishDone(ob); } else if(G.mode==='space') spaceDestroy(ob,perfect); else { SFX.solved(); pop(ob.x+ob.w/2,GY-115,perfect?'Perfect!':'Goed!',perfect?'#5be37d':'#fff'); }
      adapt(ob,'ok'); finishPrompt(ob); }
  } else {
    ob.errors++; st.e++; ob.errAt[ob.pos]=1; prof.totalErr++; const tk=keyOf(e.key); if(tk.length===1){ st.conf=st.conf||{}; st.conf[tk]=(st.conf[tk]||0)+1; } G.sessErr++; G.combo=0; SFX.error(); pressKey(keyOf(e.key),true); onError(ob,e.key);
    const pb=document.getElementById('promptbar'); pb.classList.remove('err'); void pb.offsetWidth; pb.classList.add('err');
  }
  renderPrompt(); renderHUD();
}
window.addEventListener('keydown',onKey);
function pressKey(k,wrong){ const el=KEYS[k]; if(!el) return; el.classList.add(wrong?'wrong':'pressed'); setTimeout(()=>el.classList.remove('pressed','wrong'),120); }

// ───────────────────────── Geanimeerde handen: vingertoppen op de thuisrij, duimen op de spatiebalk ─────────────────────────
const TIPCOL={lp:'#ff7eb6',lr:'#ffa94d',lm:'#ffe066',li:'#69db7c',ri:'#69db7c',rm:'#ffe066',rr:'#ffa94d',rp:'#ff7eb6',lt:'#b197fc',rt:'#b197fc'};
const HANDS={tips:{},el:null,on:true};
function keyCenter(k,dx){ const el=KEYS[k]; return {x:el.offsetLeft+el.offsetWidth/2+(dx||0),y:el.offsetTop+el.offsetHeight/2}; }
function handsHome(id){ if(id==='lt') return keyCenter(' ',-60); if(id==='rt') return keyCenter(' ',60); return keyCenter(HOME[id]); }
function buildHands(){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.id='hands'; document.getElementById('kb').appendChild(svg); HANDS.el=svg; HANDS.tips={};
  const mk=(t,cls)=>{ const e=document.createElementNS('http://www.w3.org/2000/svg',t); if(cls) e.setAttribute('class',cls); svg.appendChild(e); return e; };

  HANDS.wristL=mk('rect','palm'); HANDS.wristR=mk('rect','palm'); HANDS.palmL=mk('path','palm'); HANDS.palmR=mk('path','palm');
  for(const id of ['lt','lp','lr','lm','li','ri','rm','rr','rp','rt']){ const h=handsHome(id); HANDS.tips[id]={x:h.x,y:h.y,tx:h.x,ty:h.y,o:mk('path','fo'),l:mk('path','ff'),b:mk('path','fb'),c:mk('ellipse','tip')}; HANDS.tips[id].c.setAttribute('fill',TIPCOL[id]); }

  document.getElementById('btnHands').onclick=()=>{ HANDS.on=!HANDS.on; svg.classList.toggle('off',!HANDS.on); document.getElementById('btnHands').textContent=HANDS.on?'✋ handen aan':'✋ handen uit'; try{ localStorage.setItem('letterloper.hands',HANDS.on?'1':'0'); }catch(e){} };
}
// Welke vinger moet waarheen voor dit teken (null = alles terug naar de thuisrij)
function handsTarget(ch){
  for(const id in HANDS.tips){ const h=handsHome(id); HANDS.tips[id].tx=h.x; HANDS.tips[id].ty=h.y; }
  if(!ch) return; const k=keyOf(ch), f=FINGER[k]||'th';
  if(f==='th'){ const c=keyCenter(' ',40); HANDS.tips.rt.tx=c.x; HANDS.tips.rt.ty=c.y-4; }
  else if(KEYS[k]){ const c=keyCenter(k); HANDS.tips[f].tx=c.x; HANDS.tips[f].ty=c.y; }
  if(needsShift(ch)){ const sh=f[0]==='l'?'rshift':'lshift', c=keyCenter(sh); HANDS.tips[sh==='lshift'?'lp':'rp'].tx=c.x; HANDS.tips[sh==='lshift'?'lp':'rp'].ty=c.y; }
}
function drawHands(){
  if(!HANDS.on) return; const kb=document.getElementById('kb'); const svg=HANDS.el; svg.setAttribute('width',kb.offsetWidth); svg.setAttribute('height',kb.offsetHeight);
  const d=keyCenter(HOME.lm), f=keyCenter(HOME.li), j=keyCenter(HOME.ri), k=keyCenter(HOME.rm); const kw=KEYS[HOME.li].offsetWidth; const py=d.y+kw*3.0;
  const L={x:(d.x+f.x)/2,y:py}, R={x:(j.x+k.x)/2,y:py};
  // palm: afgeronde vorm met pols eronder, lichte schaduw bovenin
  const palmPath=(P,side)=>{ const w=kw*1.75,h=kw*1.3,r=kw*0.9; const x0=P.x-w,x1=P.x+w,y0=P.y-h,y1=P.y+h; return `M${x0+r} ${y0} H${x1-r} Q${x1} ${y0} ${x1} ${y0+r} V${y1-r*0.6} Q${x1} ${y1} ${x1-r*0.6} ${y1} H${x0+r*0.6} Q${x0} ${y1} ${x0} ${y1-r*0.6} V${y0+r} Q${x0} ${y0} ${x0+r} ${y0} Z`; };

  for(const [wr,P] of [[HANDS.wristL,L],[HANDS.wristR,R]]){ wr.setAttribute('x',P.x-kw*1.1); wr.setAttribute('y',P.y+kw*0.8); wr.setAttribute('width',kw*2.2); wr.setAttribute('height',kw*2.5); wr.setAttribute('rx',kw*0.5); }
  for(const [sh,P] of [[HANDS.shadeL,L],[HANDS.shadeR,R]]){ sh.setAttribute('cx',P.x); sh.setAttribute('cy',P.y-kw*0.3); sh.setAttribute('rx',kw*1.2); sh.setAttribute('ry',kw*0.5); }
  // vingers: basis op de palm, lichte buiging naar buiten, taps toelopend (dikkere basislaag)
  const base={lp:[L,-1.45,-0.9,0.46],lr:[L,-0.75,-1.2,0.52],lm:[L,0,-1.25,0.54],li:[L,0.75,-1.15,0.52],lt:[L,1.55,0.1,0.6],ri:[R,-0.75,-1.15,0.52],rm:[R,0,-1.25,0.54],rr:[R,0.75,-1.2,0.52],rp:[R,1.45,-0.9,0.46],rt:[R,-1.55,0.1,0.6]};
  for(const id in HANDS.tips){ const t=HANDS.tips[id]; t.x+=(t.tx-t.x)*0.22; t.y+=(t.ty-t.y)*0.22; const [P,ox,oy,fw]=base[id]; const bx=P.x+ox*kw, by=P.y+oy*kw;
    const thumb=id.endsWith('t'); const side=id[0]==='l'?-1:1; const bend=thumb?-side*kw*0.5:side*kw*0.18; const mx=(bx+t.x)/2+bend, my=(by+t.y)/2+(thumb?kw*0.2:0);
    const dpath=`M${bx} ${by} Q${mx} ${my} ${t.x} ${t.y}`, dbase=`M${bx} ${by} Q${(bx+mx)/2} ${(by+my)/2} ${mx} ${my}`;
    t.o.setAttribute('d',dpath); t.o.setAttribute('stroke-width',fw*kw+5); t.l.setAttribute('d',dpath); t.l.setAttribute('stroke-width',fw*kw); t.b.setAttribute('d',dbase); t.b.setAttribute('stroke-width',fw*kw*1.22);
    const moving=Math.abs(t.tx-handsHome(id).x)>1||Math.abs(t.ty-handsHome(id).y)>1;
    const ang=Math.atan2(t.y-my,t.x-mx)*180/Math.PI; t.c.setAttribute('cx',t.x); t.c.setAttribute('cy',t.y); t.c.setAttribute('rx',kw*(moving?0.3:0.24)); t.c.setAttribute('ry',kw*(moving?0.24:0.19)); t.c.setAttribute('transform',`rotate(${ang} ${t.x} ${t.y})`); }
}

function showAnalysis(back){

  const key=k=>{ const st=prof.keys[k]; const open=A.has(k)||(k==='/'&&A.has('?')); if(!open||!st||!st.p) return `<div class="hk na${k===' '?' space':''}">${KEYLABEL[k]||k}<small>${open?'nog geen data':'nog dicht'}</small></div>`; const r=st.c/st.p; return `<div class="hk${k===' '?' space':''}" style="--hc:${col(r)}">${KEYLABEL[k]||k}<small>${Math.round(r*100)}% · ${st.p}×</small></div>`; };

  const nm=k=>k===' '?'spatie':k; const conf=k=>{ const c=prof.keys[k]&&prof.keys[k].conf; if(!c) return ''; const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return top&&top[1]>=2?` · vaak verward met <b>${nm(top[0])}</b>`:''; };

// ───────────────────────── Update ─────────────────────────
function update(dt){
  G.t+=dt; const hero=G.hero;
  if(G.mode==='space'){
    maybeSpawn(); const a=G.active; if(prof.calm&&a&&!a.solved&&a.x<=HX+260) G.vTarget=0;
    G.v+=(G.vTarget-G.v)*Math.min(1,dt*(G.vTarget===0?6:3)); G.off+=G.v*dt;
    G.shipY+=(H/2+Math.sin(G.t*1.3)*18+(a?(a.y-H/2)*0.35:0)-G.shipY)*Math.min(1,dt*2.5);
    for(const ob of G.obs){ ob.x-=G.v*dt; ob.rot+=dt*0.8; ob.appear=Math.min(1,(ob.appear||0)+dt*3); if(!ob.resolved&&!ob.solved&&ob.x<=HX+70) spaceHit(ob); }
    G.obs=G.obs.filter(o=>!o.gone&&o.x>-200);
    for(const b of G.bolts) b.t-=dt; G.bolts=G.bolts.filter(b=>b.t>0);
    if(G.shield>0) G.shield-=dt; if(G.warp>0) G.warp-=dt;
    for(const p of G.parts){ p.t-=dt; p.x+=p.vx*dt-G.v*dt*0.3; p.y+=p.vy*dt; p.vy*=0.98; } G.parts=G.parts.filter(p=>p.t>0);
    for(const p of G.pops){ p.t-=dt*0.9; p.y-=40*dt; } G.pops=G.pops.filter(p=>p.t>0);
    if(G.shake>0) G.shake-=dt; return;
  }
  if(G.mode==='house'){ G.toyT-=dt; maybeSpawn();
    for(const ob of G.obs){ ob.appear=Math.min(1,ob.appear+dt*3); if(ob.anim>0) ob.anim-=dt; if(ob.mood>0) ob.mood-=dt; if(ob===G.active&&!prof.calm){ ob.timer+=dt; if(ob.timer>=ob.T) wishFail(ob); } else if(ob.resolved){ ob.leave=(ob.leave||0)+dt; if(ob.leave>1.2) ob.gone=true; } }
    G.obs=G.obs.filter(o=>!o.gone);
  } else {
    maybeSpawn();
    // Rustig-modus: het obstakel stopt vlak voor de held en wacht tot het getypt is.
    const a=G.active; if(prof.calm&&a&&!a.solved&&a.x<=HX+150) G.vTarget=0;
    G.v+=(G.vTarget-G.v)*Math.min(1,dt*(G.vTarget===0?6:3)); G.off+=G.v*dt;
    for(const ob of G.obs){
      ob.x-=G.v*dt; ob.appear=Math.min(1,(ob.appear===undefined?1:ob.appear)+dt*3);
      if(ob.squash!==undefined&&ob.squash>0){ ob.squash-=dt; if(ob.squash<=0) ob.gone=true; }
      if(ob.bump>0) ob.bump-=dt;
      if(!ob.triggered&&ob.x<=HX+(ob.type==='pit'?46:30)){ ob.triggered=true;
        if(ob.type==='flag'){ G.world++; prof.worlds=Math.max(prof.worlds,G.world); G.coins+=20; prof.coins+=20; SFX.flag(); toast('Wereld '+G.world+': '+theme().name); pop(HX+24,GY-150,'Wereld '+G.world+'!','#ffcc3d'); burst(HX+24,GY-60,'#ffcc3d',30); renderHUD(); }
        else if(ob.solved) doAction(ob); else if(!ob.resolved) doFail(ob);
      }
    }
    G.obs=G.obs.filter(o=>o.x>-300&&!o.gone);
    if(hero.fall>0){ hero.fall-=dt; hero.y+=220*dt; if(hero.fall<=0){ hero.y=GY; hero.vy=0; hero.air=false; } }
    else if(hero.air){ hero.vy+=hero.g*dt; hero.y+=hero.vy*dt; if(hero.y>=GY){ hero.y=GY; hero.air=false; hero.vy=0; burst(HX+24,GY,'#ffffff88',3); } }
    if(hero.hurtT>0) hero.hurtT-=dt;
    hero.ft+=dt*(4+G.v/40); hero.frame=Math.floor(hero.ft)%2;
  }
  for(const p of G.parts){ p.t-=dt; p.vy+=600*dt; p.x+=p.vx*dt-(G.mode==='house'?0:G.v*dt); p.y+=p.vy*dt; }
  G.parts=G.parts.filter(p=>p.t>0);
  for(const p of G.pops){ p.t-=dt*0.9; p.y-=40*dt; if(G.mode!=='house') p.x-=G.v*dt*0.5; }
  G.pops=G.pops.filter(p=>p.t>0);
  if(G.shake>0) G.shake-=dt;
}

function drawSpace(){

let K=1;
function fit(){
  const app=document.getElementById('app'); app.style.zoom=1;
  const bw=document.documentElement.clientWidth-36, bh=window.innerHeight-40;
  const s=clamp(Math.min(bw/app.offsetWidth,bh/app.offsetHeight),0.4,4);
  app.style.zoom=s;
  const k=clamp(Math.ceil(s*(window.devicePixelRatio||1)),1,4);
  if(k!==K){ K=k; cv.width=W*K; cv.height=H*K; }
}
window.addEventListener('resize',fit); fit(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit); setTimeout(fit,600);
